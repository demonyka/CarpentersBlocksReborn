name: publish

# Builds the release jars and uploads them to Modrinth and CurseForge when a GitHub release is published.
# Needs repository variables MODRINTH_ID and CURSEFORGE_ID, and secrets MODRINTH_TOKEN and CURSEFORGE_TOKEN.
# A platform without its token is skipped. See docs/RELEASE.md.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check release tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          test "$TAG" = "v$version" || { echo "Release tag $TAG does not match mod_version $version in gradle.properties, expected v$version"; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Build the release jars (no test code inside)
        run: ./gradlew build --console=plain
      - name: Read version and changelog
        id: meta
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          minecraft=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          case "$version" in
            *alpha*) channel=alpha ;;
            *beta*)  channel=beta ;;
            *)       channel=release ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minecraft=$minecraft" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          awk -v v="$version" 'index($0, "## " v " ") == 1 {f=1; next} /^## /{f=0} f' CHANGELOG.md > release-changelog.md
          test -s release-changelog.md || { echo "No CHANGELOG.md section for $version"; exit 1; }
      - name: Publish the Forge jar
        uses: Kir-Antipov/mc-publish@c23376546a97f5ba7984e94445da359459b14419 # v3.3.2
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: forge/build/libs/carpentersblocks-${{ steps.meta.outputs.version }}+mc${{ steps.meta.outputs.minecraft }}-forge.jar
          name: Carpenter's Blocks Reborn ${{ steps.meta.outputs.version }} (Forge)
          version: ${{ steps.meta.outputs.version }}+mc${{ steps.meta.outputs.minecraft }}-forge
          version-type: ${{ steps.meta.outputs.channel }}
          changelog-file: release-changelog.md
          loaders: forge
          game-versions: ${{ steps.meta.outputs.minecraft }}
          java: 8
          dependencies: |
            jade(optional){modrinth:jade}{curseforge:jade}
      - name: Publish the Fabric jar
        uses: Kir-Antipov/mc-publish@c23376546a97f5ba7984e94445da359459b14419 # v3.3.2
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: fabric/build/libs/carpentersblocks-${{ steps.meta.outputs.version }}+mc${{ steps.meta.outputs.minecraft }}-fabric.jar
          name: Carpenter's Blocks Reborn ${{ steps.meta.outputs.version }} (Fabric)
          version: ${{ steps.meta.outputs.version }}+mc${{ steps.meta.outputs.minecraft }}-fabric
          version-type: ${{ steps.meta.outputs.channel }}
          changelog-file: release-changelog.md
          loaders: fabric
          game-versions: ${{ steps.meta.outputs.minecraft }}
          java: 8
          dependencies: |
            fabric-api(required){modrinth:fabric-api}{curseforge:fabric-api}
