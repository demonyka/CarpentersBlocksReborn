plugins {
    id "com.github.johnrengelman.shadow"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common { canBeResolved = true; canBeConsumed = false }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
    shadowBundle { canBeResolved = true; canBeConsumed = false }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowBundle project(path: ":common", configuration: "transformProductionFabric")
    shadowBundle project(":core")
}

processResources {
    // LGPL: the licence text travels with the binary.
    from(rootProject.file("LICENSE")) { rename { "LICENSE_carpentersblocks.txt" } }
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
    // Fabric Loader looks for the access widener inside this mod's own resources,
    // including in the dev environment where :common is a separate classpath entry.
    from(project(":common").loom.accessWidenerPath)
}

// Release jars leave the automated tests out; "-PwithTests" builds the jar the test scripts run.
def withTests = project.hasProperty("withTests")

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = withTests ? "dev-shadow-tests" : "dev-shadow"
    inputs.property "withTests", withTests
    if (!withTests) {
        exclude "com/carpentersblocks/client/devtest/**"
        exclude "com/carpentersblocks/util/SmokeTest*"
        exclude "com/carpentersblocks/util/MultiplayerTest*"
    }
    // The access widener now comes from both :fabric and :common; keep one copy.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

remapJar {
    archiveBaseName = rootProject.archives_base_name
    inputFile.set shadowJar.archiveFile
    archiveClassifier = null
    archiveVersion = "${project.version}+mc${rootProject.minecraft_version}-fabric" + (withTests ? "-tests" : "")
}

jar { archiveClassifier = "dev" }

// ./gradlew :<platform>:runClientTest  - automated client run with screenshots (see ClientTestHarness).
loom {
    runs {
        clientTest {
            client()
            configName = "Client Test"
            runDir = "run-clienttest"
            // -PcbTest=mp-a / mp-b and -PcbUser=... select the multiplayer roles (tools/mp-test.sh).
            vmArg "-Dcarpentersblocks.clientTest=${project.findProperty('cbTest') ?: 'true'}"
            programArgs "--width", "1280", "--height", "720", "--username", "${project.findProperty('cbUser') ?: 'CBTester'}"
        }
    }
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
}

loom {
    mixin {
        defaultRefmapName = "carpentersblocks-fabric-refmap.json"
    }
}

// Compatibility check: ./gradlew :fabric:runClientTest -PwithSodium (Sodium + Indium in the dev client).
repositories {
    maven { url "https://api.modrinth.com/maven" }
}
dependencies {
    if (project.hasProperty("withSodium")) {
        modLocalRuntime "maven.modrinth:sodium:mc1.16.5-0.2.0"
        if (!project.hasProperty("noIndium")) {
            modLocalRuntime "maven.modrinth:indium:1.0.0+mc1.16.5"
        }
    }
}
