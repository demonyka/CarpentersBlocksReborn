plugins {
    id "com.github.johnrengelman.shadow"
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common { canBeResolved = true; canBeConsumed = false }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
    shadowBundle { canBeResolved = true; canBeConsumed = false }
}

dependencies {
    forge "net.minecraftforge:forge:${rootProject.forge_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowBundle project(path: ":common", configuration: "transformProductionForge")
    shadowBundle project(":core")
    // Forge dev runtime needs :core as a mod-classpath entry, not just a library.
    forgeRuntimeLibrary project(":core")
}

processResources {
    // The licences travel with the binary: Apache 2.0 for the code, LGPL 2.1 for the
    // textures and logo of the original mod (see NOTICE).
    from(rootProject.file("LICENSE")) { rename { "LICENSE_carpentersblocks.txt" } }
    from(rootProject.file("LICENSE-ASSETS")) { rename { "LICENSE-ASSETS_carpentersblocks.txt" } }
    from(rootProject.file("NOTICE")) { rename { "NOTICE_carpentersblocks.txt" } }
    inputs.property "version", project.version
    filesMatching("META-INF/mods.toml") {
        expand "version": project.version
    }
}

// Release jars leave the automated tests out; "-PwithTests" builds the jar the test scripts run.
def withTests = project.hasProperty("withTests")

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = withTests ? "dev-shadow-tests" : "dev-shadow"
    inputs.property "withTests", withTests
    if (!withTests) {
        exclude "com/carpentersblocks/client/devtest/**"
        exclude "com/carpentersblocks/util/SmokeTest*"
        exclude "com/carpentersblocks/util/MultiplayerTest*"
    }
}

remapJar {
    archiveBaseName = rootProject.archives_base_name
    inputFile.set shadowJar.archiveFile
    archiveClassifier = null
    archiveVersion = "${project.version}+mc${rootProject.minecraft_version}-forge" + (withTests ? "-tests" : "")
}

jar { archiveClassifier = "dev" }

// ./gradlew :<platform>:runClientTest  - automated client run with screenshots (see ClientTestHarness).
loom {
    runs {
        clientTest {
            client()
            configName = "Client Test"
            runDir = "run-clienttest"
            // -PcbTest=mp-a / mp-b and -PcbUser=... select the multiplayer roles (tools/mp-test.sh).
            vmArg "-Dcarpentersblocks.clientTest=${project.findProperty('cbTest') ?: 'true'}"
            programArgs "--width", "1280", "--height", "720", "--username", "${project.findProperty('cbUser') ?: 'CBTester'}"
        }
    }
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
    forge {
        convertAccessWideners = true
        extraAccessWideners.add loom.accessWidenerPath.get().asFile.name
        mixinConfig "carpentersblocks-forge.mixins.json"
    }
    mixin {
        defaultRefmapName = "carpentersblocks-forge-refmap.json"
    }
}

// The CTM mod's facade interface (Chisel's connected textures); only needed to compile.
repositories {
    maven {
        url "https://maven.tterrag.com/"
        content { includeGroup "team.chisel.ctm" }
    }
}
dependencies {
    modCompileOnly("team.chisel.ctm:CTM:MC1.16.1-1.1.2.6") { transitive = false }
}
