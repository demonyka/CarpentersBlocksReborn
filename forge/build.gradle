plugins {
    id "com.github.johnrengelman.shadow"
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common { canBeResolved = true; canBeConsumed = false }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
    shadowBundle { canBeResolved = true; canBeConsumed = false }
}

dependencies {
    forge "net.minecraftforge:forge:${rootProject.forge_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowBundle project(path: ":common", configuration: "transformProductionForge")
    shadowBundle project(":core")
    // Forge dev runtime needs :core as a mod-classpath entry, not just a library.
    forgeRuntimeLibrary project(":core")
}

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/mods.toml") {
        expand "version": project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"
}

remapJar {
    archiveBaseName = rootProject.archives_base_name
    inputFile.set shadowJar.archiveFile
    archiveClassifier = null
    archiveVersion = "${project.version}+mc${rootProject.minecraft_version}-forge"
}

jar { archiveClassifier = "dev" }

// ./gradlew :<platform>:runClientTest  - automated client run with screenshots (see ClientTestHarness).
loom {
    runs {
        clientTest {
            client()
            configName = "Client Test"
            runDir = "run-clienttest"
            // -PcbTest=mp-a / mp-b and -PcbUser=... select the multiplayer roles (tools/mp-test.sh).
            vmArg "-Dcarpentersblocks.clientTest=${project.findProperty('cbTest') ?: 'true'}"
            programArgs "--width", "1280", "--height", "720", "--username", "${project.findProperty('cbUser') ?: 'CBTester'}"
        }
    }
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
    forge {
        convertAccessWideners = true
        extraAccessWideners.add loom.accessWidenerPath.get().asFile.name
    }
}
